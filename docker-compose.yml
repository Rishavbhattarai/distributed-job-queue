# One-command local stack: `docker compose up --build`
#   API:  http://localhost:8000  (OpenAPI docs at /docs)
# Scale workers later with: docker compose up --scale worker=4

x-jobq-env: &jobq-env
  JOBQ_DATABASE_URL: postgresql+asyncpg://jobq:jobq@postgres:5432/jobq
  JOBQ_REDIS_URL: redis://redis:6379/0
  JOBQ_LOG_LEVEL: INFO

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobq
      POSTGRES_PASSWORD: jobq
      POSTGRES_DB: jobq
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobq -d jobq"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # AOF on so a Redis restart keeps queued ids (Postgres is still the source of truth).
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    image: jobq:dev
    command: ["alembic", "upgrade", "head"]
    environment: *jobq-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: jobq:dev
    command: ["uvicorn", "jobq.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *jobq-env
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    image: jobq:dev
    command: ["jobq-worker"]
    environment:
      <<: *jobq-env
      # JOBQ_HANDLER_MODULES: "billing.jobs"   # extra handler modules (e.g. Project 3)
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    stop_grace_period: 30s

  # TODO(week 4): Prometheus + Grafana (dashboards committed as JSON).
  # prometheus:
  #   image: prom/prometheus:latest
  #   volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  #   ports: ["9090:9090"]
  # grafana:
  #   image: grafana/grafana-oss:latest
  #   ports: ["3000:3000"]

volumes:
  pgdata:
  redisdata:

[project]
name = "jobq"
version = "1.0.0"
description = "Distributed job processing system: Redis broker, Postgres source of truth, at-least-once + idempotency."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# The core install is ONLY the client library (jobq.client), so other projects
# can `pip install jobq` without pulling in the server stack.
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "structlog>=24.1",
    "pydantic>=2.7",
    "croniter>=2.0",
    "prometheus-client>=0.20",
]
dev = [
    "jobq[server]",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres,redis]>=4.15",
    "types-croniter",
]

[project.scripts]
jobq-worker = "jobq.worker:main"
jobq-reaper = "jobq.reaper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobq"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
# ASYNC109: our `timeout` args are passed through to Redis BLPOP / polling loops on purpose.
ignore = ["ASYNC109"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "asyncpg.*", "docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs real Postgres + Redis (env vars or Docker via testcontainers)",
]

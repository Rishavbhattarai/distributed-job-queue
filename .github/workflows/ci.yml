name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobq
          POSTGRES_PASSWORD: jobq
          POSTGRES_DB: jobq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobq -d jobq"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      JOBQ_TEST_DATABASE_URL: postgresql+asyncpg://jobq:jobq@localhost:5432/jobq
      JOBQ_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Ruff lint
        run: .venv/bin/ruff check .
      - name: Ruff format
        run: .venv/bin/ruff format --check .
      - name: Mypy
        run: .venv/bin/mypy
      - name: Pytest
        run: .venv/bin/pytest -v

  compose-smoke:
    # Full stack via docker compose: enqueue one job and wait for status=succeeded.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build --wait api worker
      - name: Enqueue and wait
        run: ./scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]

  # Every worker replica: Docker's DNS returns one A record per container.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 5s

  - job_name: reaper
    static_configs:
      - targets: ["reaper:9101"]
